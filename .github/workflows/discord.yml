name: Actualizar Status via Webhook

on:
  repository_dispatch:
    types: [update_status]

permissions:
  contents: write

jobs:
  update-file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Actualizar status.json
        run: |
          cat << 'EOF' > status.json
          ${{ toJson(github.event.client_payload) }}
          EOF

      - name: Guardar cambios en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json
          git commit -m "Actualizado via Webhook HTTP" || exit 0
          git push

      - name: Notificar a Discord
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d '{
            "username": "Ikgonavi Status Bot",
            "embeds": [{
              "title": "🟢 Datos Actualizados por Webhook",
              "description": "Se ha actualizado status.json mediante peticion HTTP.",
              "color": 5763719
            }]
          }' \
          "https://discord.com/api/webhooks/1539040228873076837/4vpo5dQgn3F1XXpallGCECAEomiaTEIWVSGd7-czYVgcCPPwr7fS-hdp-hKaZvSajuyG"
